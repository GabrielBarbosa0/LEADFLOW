name: leadflow-homologacao

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:staging
    init: true
    ports:
      - "127.0.0.1:5175:5175"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - leadflow_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5175/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  emulators:
    profiles: ["disposable"]
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run emulators:docker
    init: true
    environment:
      GCLOUD_PROJECT: demo-leadflow
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8180:8180"
      - "127.0.0.1:9099:9099"
    volumes:
      - .:/app
      - leadflow_node_modules:/app/node_modules
      - leadflow_functions_node_modules:/app/functions/node_modules
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  app-emulator:
    profiles: ["disposable"]
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:emulator
    init: true
    depends_on:
      emulators:
        condition: service_healthy
    ports:
      - "127.0.0.1:5176:5176"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-leadflow.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-leadflow
      VITE_FIREBASE_STORAGE_BUCKET: demo-leadflow.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:demo"
      VITE_USE_FIREBASE_EMULATORS: "true"
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1
      VITE_FIREBASE_AUTH_EMULATOR_PORT: "9099"
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
      VITE_FIRESTORE_EMULATOR_PORT: "8180"
      VITE_FUNCTIONS_EMULATOR_PORT: "5001"
    volumes:
      - .:/app
      - leadflow_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5176/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  leadflow_node_modules:
  leadflow_functions_node_modules:
