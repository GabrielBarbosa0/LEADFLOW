name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run profile and permission E2E tests
        run: npx firebase emulators:exec --project demo-leadflow --config firebase.emulators.docker.json --only auth,firestore,functions "npm run seed:emulator:reset && npm run test:e2e"
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-leadflow.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-leadflow
          VITE_FIREBASE_STORAGE_BUCKET: demo-leadflow.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:demo"
          VITE_USE_FIREBASE_EMULATORS: "true"
          VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1
          VITE_FIREBASE_AUTH_EMULATOR_PORT: "9099"
          VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
          VITE_FIRESTORE_EMULATOR_PORT: "8180"
          VITE_FUNCTIONS_EMULATOR_PORT: "5001"

      - name: Validate Firebase configuration
        run: test -n "$VITE_FIREBASE_API_KEY"
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Build application
        run: npm run build:pages
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: fascinlead.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: fascinlead
          VITE_FIREBASE_STORAGE_BUCKET: fascinlead.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 165770349928
          VITE_FIREBASE_APP_ID: 1:165770349928:web:7d9f30b09443fa3bf1dadd
          VITE_USE_FIREBASE_EMULATORS: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
